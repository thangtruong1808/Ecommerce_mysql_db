services:
  backend:
    build:
      context: ./backend
    container_name: ecommerce_backend
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    container_name: ecommerce_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
