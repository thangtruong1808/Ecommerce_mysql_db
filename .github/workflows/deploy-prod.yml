name: Deploy production

on:
  push:
    branches:
      - prod

concurrency:
  group: vps-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the repository to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'frontend/node_modules/' \
            --exclude 'backend/node_modules/' \
            --exclude 'documentation/' \
            --exclude 'frontend/dist/' \
            --exclude 'backend/dist/' \
            --exclude 'backend/.env' \
            --exclude 'frontend/.env' \
            --exclude 'backend/uploads/' \
            --exclude '.env_vps' \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            ./ "${VPS_USER}@${VPS_HOST}:/opt/projects/ecommerce_mysql_db/"

      - name: Build and start this shop
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "sh /opt/projects/ecommerce_mysql_db/scripts/vps-up.sh"
